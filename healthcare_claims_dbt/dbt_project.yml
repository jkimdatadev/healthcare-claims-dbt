# Healthcare Claims Analytics: eligibility, member-month, and utilization models on DuckDB.
name: 'healthcare_claims_dbt'
version: '1.0.0'

profile: 'healthcare_claims_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Default materialization per layer; models can override with {{ config(...) }}.
# staging:      views; thin renames/casts, always in sync with the raw data.
# intermediate: views; small data, so recomputing is cheap and keeps them in sync.
# marts:        tables; queried directly by analysts and dashboards.
models:
  healthcare_claims_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts: 
      +materialized: table

# Pin seed types where inference could go wrong (IDs, dates); other columns infer as varchar.
seeds:
  healthcare_claims_dbt:
    raw_members:
      +column_types:
        member_id: varchar
        date_of_birth: date
        created_at: timestamp
        updated_at: timestamp

vars:
  # Eligibility and medical claims datasets extend through this date.
  # This variable is used to bound open-ended eligibility segments for reproducible analysis.
  analysis_through_date: '2026-06-30'

