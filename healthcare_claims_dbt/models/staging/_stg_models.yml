version: 2

models:
  - name: stg_members
    description: "One row per member. Standardized demographics only; no eligibility attributes."
    columns:
      - name: member_id
        description: "Natural key for the member."
        data_tests:
          - unique
          - not_null
      - name: date_of_birth
        data_tests:
          - not_null
      - name: gender_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'M']
      - name: residence_state_code
        description: "Member state of residence; may differ from plan state."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DE', 'NJ', 'NY', 'PA']

  - name: stg_plans
    description: "One row per plan_id. Natural key: plan_brand_code + aid_category_code + plan_benefit_package_code, assuming each brand operates in one state. plan_brand_name is shared across multiple plans."
    columns:
      - name: plan_id
        data_tests:
          - unique
          - not_null
      - name: plan_brand_name
        data_tests:
          - not_null
      - name: plan_brand_code
        description: "Stable identifier for the plan brand; one code per brand name."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BR01', 'BR02', 'BR03', 'BR04']
      - name: plan_benefit_package_code
        description: "CMS contract and plan benefit package (PBP) number, such as H3101-003. Null for Medicaid plans."
        data_tests:
          - unique
      - name: product_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MCD', 'DSNP', 'MA']
      - name: program_type_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MEDICAID', 'MEDICARE']
      - name: state_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DE', 'NJ', 'NY', 'PA']
      - name: medicare_status_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NONE', 'AB']
      - name: aid_category_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['ABD', 'LTC', 'TANF']
      - name: coverage_type_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['FULL', 'LIMITED']
      - name: effective_date
        data_tests:
          - not_null
      - name: term_date
      - name: updated_at
        data_tests:
          - not_null

  - name: stg_eligibility_segments
    description: >
      One row per eligibility_segment_id: a continuous enrollment span for one member in one plan.
      A member can have many segments over time, including repeat segments in the same plan after a gap,
      but cannot be enrolled in more than one plan at the same time.
    columns:
      - name: eligibility_segment_id
        data_tests:
          - unique
          - not_null
      - name: member_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: plan_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_id
      - name: effective_date
        data_tests:
          - not_null
      - name: term_date
      - name: updated_at
        data_tests:
          - not_null

  - name: stg_medical_claim_lines
    description: >
      One row per medical claim line, identified by the combination of claim_id
      and claim_line_number.
    columns:
      - name: claim_id
        data_tests:
          - not_null
      - name: claim_line_number
        data_tests:
          - not_null
      - name: member_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: claim_type_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M']
      - name: claim_status_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAID', 'DENIED']
      - name: billing_provider_npi
        data_tests:
          - not_null
      - name: rendering_provider_npi
      - name: billing_provider_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['HOSP', 'LAB', 'PHYS', 'SNF']
      - name: bill_type_code
      - name: service_from_date
        data_tests:
          - not_null
      - name: service_to_date
        data_tests:
          - not_null
      - name: received_date
        data_tests:
          - not_null
      - name: paid_date
      - name: place_of_service_code
      - name: revenue_code
      - name: procedure_code
      - name: procedure_modifier
      - name: units
        data_tests:
          - not_null
      - name: diagnosis_code_1
        data_tests:
          - not_null
      - name: diagnosis_code_2
      - name: diagnosis_code_3
      - name: billed_amount
        data_tests:
          - not_null
      - name: allowed_amount
        data_tests:
          - not_null
      - name: paid_amount
        data_tests:
          - not_null
      - name: member_responsibility_amount
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null
