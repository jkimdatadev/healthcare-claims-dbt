version: 2

models:
  - name: fct_member_plan_month
    description: >
      One row per member, plan, and month with at least one eligible day.
      Monthly eligibility exposure by member and plan, used as the denominator for PMPM and utilization metrics.
    columns:
      - name: member_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: plan_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_id
      - name: month_start_date
        data_tests:
          - not_null
      - name: eligible_days
        data_tests:
          - not_null
      - name: days_in_month
        data_tests:
          - not_null
      - name: member_month_exposure
        description: "eligible_days / days_in_month; fractional member month, not rounded."
        data_tests:
          - not_null
      - name: is_dual_eligible
        description: "True when the plan's product_code is DSNP; includes partial duals."
        data_tests:
          - not_null
      - name: receives_ltss
        description: "True when the plan's aid_category_code is LTC."
        data_tests:
          - not_null
      - name: has_multiple_segments
        description: "True when more than one eligibility segment contributes to the member-plan-month."
        data_tests:
          - not_null
      - name: last_eligible_date
        description: "Last day the member was eligible in this plan during the month."
        data_tests:
          - not_null

  - name: fct_member_month
    description: >
      One row per member per month in which the member had any eligibility.
      Month-end columns are null when the member was not eligible on the last day of the month or the month is incomplete.
      For plan or product analysis, use fct_member_plan_month; a member who switches plans mid-month has only one row here.
    columns:
      - name: member_id
        description: "Member identifier; part of the member-month grain."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: month_start_date
        description: "First day of the calendar month; part of the member-month grain."
        data_tests:
          - not_null
      - name: eligible_days
        description: "Total eligible days across all plans during the month, from 1 to days_in_month."
        data_tests:
          - not_null
      - name: days_in_month
        description: "Number of calendar days in the month."
        data_tests:
          - not_null
      - name: member_month_exposure
        description: "Fractional eligible month, unrounded; sum of plan-level exposure."
        data_tests:
          - not_null
      - name: plan_count
        description: "Number of distinct plans with eligibility during the month; at least one."
        data_tests:
          - not_null
      - name: has_multiple_plans
        description: "True when plan_count > 1; indicates multiple plans within the month, not changes at month boundaries."
        data_tests:
          - not_null
      - name: last_eligible_date
        description: "Latest eligible date across plans during the month, capped at analysis_through_date."
        data_tests:
          - not_null
      - name: is_eligible_month_end
        description: "True if eligible on actual calendar month-end; false if not; null if month-end is beyond analysis_through_date."
      - name: month_end_plan_id
        description: "Plan active on actual calendar month-end; null if not eligible then or month-end is not observable."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_id
      - name: is_dual_eligible_month_end
        description: "Dual-eligibility classification of the month-end plan; null when no observable month-end plan exists."
      - name: receives_ltss_month_end
        description: "LTSS classification of the month-end plan; null when no observable month-end plan exists."

  - name: fct_medical_claim_lines
    description: >
      One row per claim_id and claim_line_number. Preserves all medical claim lines,
      including denied claims and those without matching eligibility. Eligibility
      and plan attribution are based on service_from_date.
    columns:
      - name: claim_id
        description: Unique claim identifier within the composite claim-line grain.
        data_tests:
          - not_null
      - name: claim_line_number
        description: Line number within a claim.
        data_tests:
          - not_null
      - name: member_id
        description: Member identifier, nullable when unavailable on the claim.
      - name: eligibility_segment_id
        description: Matched eligibility segment identifier, if available.
      - name: plan_id
        description: Plan identifier from the matched eligibility segment.
      - name: has_matching_eligibility
        description: Indicates whether the claim service start date matches an eligibility segment.
        data_tests:
          - not_null
      - name: state_code
        description: State associated with the matched plan.
      - name: product_code
        description: Product classification of the matched plan.
      - name: aid_category_code
        description: Aid category of the matched plan.
      - name: claim_type_code
        description: Claim type classification.
        data_tests:
          - not_null
      - name: claim_status_code
        description: Claim processing status.
        data_tests:
          - not_null
      - name: service_from_date
        description: First date of service, used for eligibility attribution.
        data_tests:
          - not_null
      - name: service_from_month_start_date
        description: First calendar day of the month containing service_from_date.
        data_tests:
          - not_null
      - name: service_to_date
        description: Last date of service.
        data_tests:
          - not_null
      - name: received_date
        description: Date the claim was received for processing, when available.
      - name: paid_date
        description: Date the claim was paid, when applicable.
      - name: updated_at
        description: Most recent source-record update timestamp.
        data_tests:
          - not_null
      - name: billed_amount
        description: Amount billed by the provider, preserving source values and adjustments.
        data_tests:
          - not_null
      - name: allowed_amount
        description: Allowed amount, preserving source values and adjustments.
        data_tests:
          - not_null
      - name: paid_amount
        description: Amount paid by the payer, preserving source values and adjustments.
        data_tests:
          - not_null
      - name: member_responsibility_amount
        description: Member financial responsibility, preserving source values and adjustments.
        data_tests:
          - not_null
      - name: billing_provider_npi
        description: National Provider Identifier of the billing provider.
      - name: rendering_provider_npi
        description: National Provider Identifier of the rendering provider.
      - name: billing_provider_type
        description: Billing provider classification.
      - name: bill_type_code
        description: Institutional bill type code, when applicable.
      - name: place_of_service_code
        description: Place of service classification.
      - name: revenue_code
        description: Institutional revenue code, when applicable.
      - name: procedure_code
        description: Procedure or service code.
      - name: procedure_modifier
        description: Procedure modifier, when applicable.
      - name: units
        description: Number of service units, preserving source values and adjustments.
      - name: diagnosis_code_1
        description: Primary diagnosis code, when available.
      - name: diagnosis_code_2
        description: Secondary diagnosis code, when available.
      - name: diagnosis_code_3
        description: Additional diagnosis code, when available.

  - name: dim_members
    description: >
      One row per member, including members without eligibility history.
      Includes member attributes and a summary of the earliest and latest
      recorded eligibility. Latest does not necessarily mean currently active.
    columns:
      - name: member_id
        description: Unique member identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Member first name.
      - name: last_name
        description: Member last name.
      - name: date_of_birth
        description: Member date of birth.
      - name: gender_code
        description: Member gender code.
      - name: residence_state_code
        description: Member state of residence; may differ from plan state.
      - name: created_at
        description: Source record creation timestamp.
      - name: updated_at
        description: Source record last update timestamp.
      - name: earliest_eligibility_effective_date
        description: Earliest eligibility effective date in the available history.
      - name: latest_eligibility_effective_date
        description: Effective date of the most recently effective eligibility segment. Null if no eligibility history exists.
      - name: latest_eligibility_term_date
        description: >
          Termination date of the most recently effective eligibility segment.
          Null if that segment is open-ended or no eligibility history exists;
          a populated latest_eligibility_effective_date indicates the open-ended case.
      - name: latest_plan_id
        description: >
          Plan associated with the most recently effective eligibility segment.
          Not necessarily the member's currently active plan.

  - name: dim_plans
    description: >
      One row per plan_id, retaining all plans from stg_plans.
      The natural key consists of plan_brand_code, aid_category_code, and plan_benefit_package_code.
      Includes plan identifiers, classifications, effective dates, and audit information.
    columns:
      - name: plan_id
        description: Unique plan identifier.
        data_tests:
          - unique
          - not_null
      - name: plan_brand_code
        description: Identifier for the plan brand.
      - name: aid_category_code
        description: Medicaid aid category, when applicable.
      - name: plan_benefit_package_code
        description: Identifier distinguishing benefit packages within a plan brand and aid category.
      - name: plan_brand_name
        description: Plan brand name.
      - name: state_code
        description: State in which the plan operates.
      - name: product_code
        description: Plan product code.
      - name: program_type_code
        description: Plan program classification.
      - name: medicare_status_code
        description: Medicare status classification.
      - name: coverage_type_code
        description: Plan coverage classification.
      - name: effective_date
        description: Plan effective date.
      - name: term_date
        description: Plan termination date, null if open-ended.
      - name: updated_at
        description: Source record last update timestamp.

  - name: agg_plan_month_cost
    description: >
      One row per plan_id and month_start_date.
      Includes months with enrollment or paid claim activity.
      Reports paid medical costs by service month and payment month.
      Uses the plan at the time of service and excludes denied or unmatched claims.
      PMPM must be recalculated from total paid amounts and member months when aggregating.
    columns:
      - name: plan_id
        description: Plan identifier; part of the grain.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plans')
                field: plan_id
      - name: month_start_date
        description: First day of the reporting month; part of the grain.
        data_tests:
          - not_null
      - name: plan_brand_code
        description: Plan brand identifier; plan natural key component.
      - name: aid_category_code
        description: Plan aid category; plan natural key component. Null when not applicable (MA and LIMITED DSNP plans).
      - name: plan_benefit_package_code
        description: CMS contract and plan benefit package number; plan natural key component. Null for Medicaid plans.
      - name: plan_brand_name
        description: Plan brand name.
      - name: state_code
        description: Plan operating state; not member residence state.
      - name: product_code
        description: Plan product (MCD, DSNP, or MA).
      - name: service_month_paid_amount
        description: Paid amount for services in this month. Zero when none.
      - name: payment_month_paid_amount
        description: >
          Paid amount paid in this month for services through analysis_through_date.
          Can extend beyond the cutoff month. Zero when none.
      - name: member_month_count
        description: >
          Count of member-plan-months with at least one eligible day.
          Additive as member-plan-months; exceeds distinct member-months across plans when members switch plans mid-month.
      - name: fractional_member_months
        description: Sum of member_month_exposure (eligible days / days in month). Use for exposure-based rollups.
      - name: service_month_pmpm_member_count
        description: Service-month paid amount / member_month_count. Null when the denominator is 0. Do not sum or average.
      - name: service_month_pmpm_fractional_member
        description: Service-month paid amount / fractional_member_months. Null when the denominator is 0. Do not sum or average.
      - name: payment_month_pmpm_member_count
        description: Payment-month paid amount / member_month_count. Null when the denominator is 0. Do not sum or average.
      - name: payment_month_pmpm_fractional_member
        description: Payment-month paid amount / fractional_member_months. Null when the denominator is 0. Do not sum or average.

  - name: agg_plan_month_provider_type_claim_volume
    description: >
      One row per plan, service month, and billing provider type.
      Includes all four provider types for every enrolled plan-month, with zero counts when there are no claims.
      Counts paid claim lines and distinct claims for services through the analysis cutoff date.
      Assigns claims to the plan covering the service date and excludes claims without matching enrollment.
      Enrollment measures are repeated for each provider type; do not sum them across provider types.
      Rates cannot be summed or averaged; recalculate them using summed claim counts and enrollment counted once per plan-month.
    columns:
    - name: plan_id
      description: Plan identifier; part of the grain.
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dim_plans')
              field: plan_id
    - name: month_start_date
      description: First day of the service month; part of the grain.
      data_tests:
        - not_null
    - name: billing_provider_type
      description: Billing provider type (HOSP, LAB, PHYS, or SNF); part of the grain.
      data_tests:
        - not_null
        - accepted_values:
            arguments:
              values: ['HOSP', 'LAB', 'PHYS', 'SNF']
    - name: plan_brand_code
      description: Plan brand identifier; plan natural key component.
    - name: aid_category_code
      description: Plan aid category; plan natural key component. Null when not applicable (MA and LIMITED DSNP plans).
    - name: plan_benefit_package_code
      description: CMS contract and plan benefit package number; plan natural key component. Null for Medicaid plans.
    - name: plan_brand_name
      description: Plan brand name.
    - name: state_code
      description: Plan operating state; not member residence state.
    - name: product_code
      description: Plan product (MCD, DSNP, or MA).
    - name: claim_line_count
      description: Number of paid claim lines. Zero when none. Additive across all dimensions.
    - name: claim_count
      description: >
        Number of distinct paid claims. Zero when none.
        Additive across all dimensions in current data, because no claim spans provider types, plans, or service months.
    - name: member_month_count
      description: >
        Count of member-plan-months with at least one eligible day for the plan and month.
        Repeated on each provider-type row; do not sum across provider types.
    - name: fractional_member_months
      description: >
        Sum of member_month_exposure for the plan and month.
        Repeated on each provider-type row; do not sum across provider types.
    - name: claim_lines_per_1000_member_months
      description: claim_line_count × 1,000 / member_month_count. Null when the denominator is 0. Do not sum or average.
    - name: claims_per_1000_member_months
      description: claim_count × 1,000 / member_month_count. Null when the denominator is 0. Do not sum or average.
